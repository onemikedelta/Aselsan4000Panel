sentence=Arduino driver for the ASELSAN 4000-series radio front panel: 14-segment LCD, keypad, LEDs and inputs.
paragraph=Drives the whole front panel over I2C. Prints text on the eight 14-segment cells, sets the clock field and the annunciator icons on the PCF8576, reads the 4x4 keypad and the PTT, monitor and power lines, and controls the Tx/Rx LEDs and the backlight on the two PCF8574 expanders. Includes the bench-verified 14-segment font and raw segment access for unmapped bits.
